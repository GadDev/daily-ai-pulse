<text x="161" y="284" font-family="'Lato','DejaVu Sans',sans-serif" font-size="23" font-weight="700" fill="#171B1A" letter-spacing="1">RESEARCH &amp; DECISION</text>
<text x="161" y="305" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Find credible changes</text>
<rect x="638" y="242" width="525" height="658" rx="14" fill="#FFFFFF" stroke="#C7B8A5" stroke-width="1" filter="url(#shadow)"/>
<rect x="638" y="242" width="525" height="72" rx="14" fill="#EADBC7" stroke="none" stroke-width="1" />
<rect x="638" y="298" width="525" height="16" rx="0" fill="#EADBC7" stroke="none" stroke-width="1" />
<text x="662" y="288" font-family="'DejaVu Serif', Georgia,serif" font-size="29" font-weight="700" fill="#8A4B35">02</text>
<text x="731" y="284" font-family="'Lato','DejaVu Sans',sans-serif" font-size="23" font-weight="700" fill="#171B1A" letter-spacing="1">CONTENT &amp; VISUALS</text>
<text x="731" y="305" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Prepare evidence-led stories</text>
<rect x="1208" y="242" width="525" height="658" rx="14" fill="#FFFFFF" stroke="#C7B8A5" stroke-width="1" filter="url(#shadow)"/>
<rect x="1208" y="242" width="525" height="72" rx="14" fill="#EADBC7" stroke="none" stroke-width="1" />
<rect x="1208" y="298" width="525" height="16" rx="0" fill="#EADBC7" stroke="none" stroke-width="1" />
<text x="1232" y="288" font-family="'DejaVu Serif', Georgia,serif" font-size="29" font-weight="700" fill="#8A4B35">03</text>
<text x="1301" y="284" font-family="'Lato','DejaVu Sans',sans-serif" font-size="23" font-weight="700" fill="#171B1A" letter-spacing="1">REVIEW &amp; RELEASE</text>
<text x="1301" y="305" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Humans control publication</text>
<rect x="88" y="341" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="119" cy="375" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="119" y="382" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="149" y="377" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Load repository contracts</text>
<text x="149" y="406" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Schema, scoring, topics, skills, rules</text>
<text x="149" y="427" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Current main branch is authoritative</text>
<rect x="88" y="475" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="119" cy="509" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="119" y="516" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="149" y="511" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Research &amp; deduplicate</text>
<text x="149" y="540" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Primary sources + prior stories</text>
<text x="149" y="561" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Check dates, evidence and novelty</text>
<rect x="88" y="609" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="119" cy="643" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="119" y="650" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="149" y="645" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Decide &amp; persist ledger</text>
<text x="149" y="674" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">SELECTED / WATCH / REJECTED</text>
<text x="149" y="695" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">docs/editorial/ledgers/YYYY-MM-DD.json</text>
<rect x="88" y="743" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="119" cy="777" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="119" y="784" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="149" y="779" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Re-verify selected claims</text>
<text x="149" y="808" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Source validity and publication novelty</text>
<text x="149" y="829" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Withhold conflicts; keep research decisions</text>
<rect x="658" y="341" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="689" cy="375" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="689" y="382" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="719" y="377" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Draft canonical content</text>
<text x="719" y="406" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Story Markdown + daily issue manifest</text>
<text x="719" y="427" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Explain what changed and why it matters</text>
<rect x="658" y="475" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="689" cy="509" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="689" y="516" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="719" y="511" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Illustration decision</text>
<text x="719" y="540" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">REUSE or GENERATE; check identity</text>
<text x="719" y="561" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Constitution → scoring → WebP + review</text>
<rect x="658" y="609" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="689" cy="643" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="689" y="650" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="719" y="645" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Review French translations</text>
<text x="719" y="674" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Reuse current reviewed FR; draft/review</text>
<text x="719" y="695" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Withhold missing or stale translations</text>
<rect x="658" y="743" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="689" cy="777" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="689" y="784" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="719" y="779" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Preflight and save batch</text>
<text x="719" y="808" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Links, ledger mappings, images, i18n</text>
<text x="719" y="829" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">One canonical branch per editorial date</text>
<rect x="1228" y="341" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="1259" cy="375" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="1259" y="382" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="1289" y="377" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Open one draft PR</text>
<text x="1289" y="406" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Stories, artwork, issue + ledger</text>
<text x="1289" y="427" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Or ledger-only when no story qualifies</text>
<rect x="1228" y="475" width="485" height="104" rx="10" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="1259" cy="509" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="1259" y="516" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="1289" y="511" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">GitHub Actions CI</text>
<text x="1289" y="540" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">npm run verify + browser checks</text>
<text x="1289" y="561" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Failure → repair draft; never auto-merge</text>
<rect x="1228" y="609" width="485" height="104" rx="10" fill="#F7E7DB" stroke="#C7B8A5" stroke-width="1" />
<circle cx="1259" cy="643" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="1259" y="650" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
<text x="1289" y="645" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Human editorial approval</text>
<text x="1289" y="674" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Review claims, prose, images and CI</text>
<text x="1289" y="695" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Only approved merge reaches main</text>
<rect x="1228" y="743" width="485" height="104" rx="10" fill="#E6EDE7" stroke="#C7B8A5" stroke-width="1" />
<circle cx="1259" cy="777" r="18" fill="#8A4B35" stroke="none" stroke-width="1"/>
<text x="1259" y="784" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text>
<text x="1289" y="779" font-family="'Lato','DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#171B1A">Firebase Hosting deploy</text>
<text x="1289" y="808" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Build Astro + Pagefind; publish site</text>
<text x="1289" y="829" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Verify live pages after push to main</text>
