services:
  api:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - model-data:/root/.ollama
volumes:
  model-data:
