name: CI

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary guide formatting snapshot — remove before merge
        run: |
          npx prettier --write src/lib/guide-assets.ts 'src/pages/guides/[...id].astro' src/styles/article.css tests/guide-assets.test.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['src/lib/guide-assets.ts', 'src/pages/guides/[...id].astro', 'src/styles/article.css', 'tests/guide-assets.test.mjs']) {
            console.log('GUIDE_FORMATTED_SOURCE:' + JSON.stringify({ path, content: readFileSync(path, 'utf8') }));
          }
          NODE

      - name: Lint, format-check, content-check, type-check, and build
        run: npm run verify

      - name: RAG retrieval guide executable regression
        run: node --test tests/rag-retrieval-guide.test.mjs

      - name: Tools & Guides ledger validator regressions
        run: npm run guides:ledger:test

      - name: Tools & Guides cover asset regressions
        run: npm run guides:assets:test

      - name: Editorial validator regressions
        run: node --test tests/editorial-validator.test.mjs

      - name: Translation content and freshness regressions
        run: npm run translations:test

      - name: Translation batch coverage regressions
        run: npm run translations:batch:test

      - name: French page rendering and visibility regressions
        run: npm run translations:pages:test

      - name: Illustration generation identity regressions
        run: node --test tests/illustration-generation-identity.test.mjs

      - name: Illustration generation decision regressions
        run: node --test tests/illustration-generation-decision.test.mjs

      - name: Illustration validator regressions
        run: node --test tests/illustration-validator.test.mjs

      - name: Automatic preview routing regressions
        run: node --test tests/automatic-preview.test.mjs

      - name: Preview cleanup regressions
        run: node --test tests/preview-cleanup.test.mjs

      - name: Package static preview artifact
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ci-preview"
          cp -R dist "$RUNNER_TEMP/ci-preview/dist"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const testedSha = execFileSync('git', ['rev-parse', 'HEAD'], {
            encoding: 'utf8',
          }).trim();

          if (testedSha !== process.env.GITHUB_SHA) {
            throw new Error('Checkout does not match the CI event revision.');
          }

          const metadata = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            pr_number: event.pull_request.number,
            head_sha: event.pull_request.head.sha,
            base_sha: event.pull_request.base.sha,
            tested_sha: testedSha,
          };

          writeFileSync(
            `${process.env.RUNNER_TEMP}/ci-preview/provenance.json`,
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - name: Upload static preview artifact
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: ci-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-preview/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser smoke and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Illustration contact sheet regression
        run: node --test tests/illustration-contact-sheet.test.mjs

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload multilingual UX screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multilingual-ux-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
