<svg xmlns="http://www.w3.org/2000/svg" width="360" height="940" viewBox="0 0 360 940" role="img" aria-labelledby="title desc"><title id="title">Compare a prompt edit against its baseline</title><desc id="desc">The same input and settings feed two separate requests. Compare their outputs with an external answer key. Failed requirements mean revising the edit; passing this small comparison only justifies broader testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#575D5B"/></marker></defs><rect width="100%" height="100%" fill="#FAF6EE"/><path d="M100 92 V138" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 92 V138" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M100 223 V270" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 223 V270" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M100 355 V380 H130 V405" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 355 V380 H230 V405" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 525 V485" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 445 H345 V678 H320" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M105 710 V785" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 710 V785" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="20" width="300" height="72" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="180.0" y="44.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Same test input</text><text x="180.0" y="68.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">and model settings</text><rect x="30" y="138" width="140" height="85" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="100.0" y="168.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Original</text><text x="100.0" y="192.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">instructions</text><rect x="190" y="138" width="140" height="85" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="260.0" y="168.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Edited</text><text x="260.0" y="192.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">instructions</text><rect x="30" y="270" width="140" height="85" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="100.0" y="300.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Baseline</text><text x="100.0" y="324.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">request</text><rect x="190" y="270" width="140" height="85" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="260.0" y="300.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Edited</text><text x="260.0" y="324.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">request</text><rect x="40" y="405" width="280" height="80" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="180.0" y="445.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Compare both outputs</text><rect x="40" y="525" width="280" height="75" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="180.0" y="550.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Answer key stays</text><text x="180.0" y="574.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">outside both requests</text><rect x="40" y="645" width="280" height="65" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="180.0" y="677.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Requirements met?</text><rect x="20" y="785" width="150" height="110" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="95.0" y="816.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">No: revise</text><text x="95.0" y="840.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">the edit and</text><text x="95.0" y="864.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">compare again</text><rect x="190" y="785" width="150" height="110" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="265.0" y="816.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Yes: broader</text><text x="265.0" y="840.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">held-out</text><text x="265.0" y="864.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">testing next</text></svg>
