<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1090" viewBox="0 0 1800 1090" role="img" aria-labelledby="title desc"><title id="title">Daily AI Pulse: news orchestration to publication</title><desc id="desc">Three-lane diagram showing research and decisions, content and illustration preparation, and human-controlled review and Firebase publication. No suitable story produces a ledger-only PR. A separate Tools and Guides orchestrator is not part of this flow.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAF6EE"/><stop offset="100%" stop-color="#F3EBDD"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#8A4B35" flood-opacity="0.07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8A4B35"/></marker><marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#575D5B"/></marker></defs><rect width="1800" height="1090" fill="url(#bg)"/><path d="M0 0 H1800 V3 H0Z" fill="#8A4B35"/>
<text x="68" y="83" font-family="'DejaVu Serif', Georgia,serif" font-size="52" font-weight="700" fill="#171B1A" letter-spacing="-2">DAILY AI PULSE</text>
