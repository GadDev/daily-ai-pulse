<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1160" viewBox="0 0 680 1160" role="img" aria-labelledby="title desc">
<title id="title">One corpus, three chunk policies, three retrieval modes</title>
<desc id="desc">For each chunk policy, lexical and exact vector ranking use the same passages. MiniLM encodes query and passage text in a compatible space. Reciprocal rank fusion combines positions. All three lists are inspected against required source spans at rank one. No answer generation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#575D5B"/></marker></defs>
<rect width="680" height="1160" fill="#FAF6EE"/>
<g font-family="Arial, sans-serif" fill="#171B1A">
<text x="24" y="34" font-size="26" font-weight="bold">One corpus. Three chunking choices.</text>
<rect x="24" y="62" width="632" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="38" y="91" font-size="22" font-weight="bold">Freeze the inputs</text>
<text x="38" y="119" font-size="20" font-weight="normal">Three fictional documents; five questions</text>
<text x="38" y="144" font-size="20" font-weight="normal">Required source spans recorded before comparison</text>
<path d="M340 162V190H120V216" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 190V216" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 190H560V216" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="220" width="192" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="38" y="249" font-size="22" font-weight="bold">Sections</text>
<text x="38" y="277" font-size="20" font-weight="normal">4 passages</text>
<rect x="244" y="220" width="192" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="258" y="249" font-size="22" font-weight="bold">Two lines</text>
<text x="258" y="277" font-size="20" font-weight="normal">8 passages</text>
<rect x="464" y="220" width="192" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="478" y="249" font-size="22" font-weight="bold">Overlap 1</text>
<text x="478" y="277" font-size="20" font-weight="normal">13 passages</text>
<path d="M120 320V346H340V370" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 320V370" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 320V346H340" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="374" width="632" height="100" rx="7" fill="#F3EBDD" stroke="#8A4B35" stroke-width="1.5"/>
<text x="38" y="403" font-size="22" font-weight="bold">Repeat per policy: same eligible passages</text>
<text x="38" y="431" font-size="20" font-weight="normal">Source ID + starting line + document hash</text>
<text x="38" y="456" font-size="20" font-weight="normal">Separate snapshots; boundaries change the text unit</text>
<path d="M200 474V508" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 474V508" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="512" width="300" height="162" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="38" y="541" font-size="22" font-weight="bold">Lexical ranking</text>
<text x="38" y="569" font-size="20" font-weight="normal">Part 2 word overlap</text>
<text x="38" y="594" font-size="20" font-weight="normal">Positive matches only</text>
<text x="38" y="619" font-size="20" font-weight="normal">Candidate depth: at most 5</text>
<rect x="356" y="512" width="300" height="162" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="370" y="541" font-size="22" font-weight="bold">Vector ranking</text>
<text x="370" y="569" font-size="20" font-weight="normal">One pinned MiniLM encoder</text>
<text x="370" y="594" font-size="20" font-weight="normal">Query + passage: 384 values</text>
<text x="370" y="619" font-size="20" font-weight="normal">Mean pooling + normalize</text>
<path d="M506 674V702" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="356" y="706" width="300" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="370" y="735" font-size="22" font-weight="bold">Exact cosine search</text>
<text x="370" y="763" font-size="20" font-weight="normal">Scan every passage vector</text>
<text x="370" y="788" font-size="20" font-weight="normal">Keep at most 5 candidates</text>
<path d="M174 674V844H280V868" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M506 806V844H400V868" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="150" y="872" width="380" height="100" rx="7" fill="#F3EBDD" stroke="#8A4B35" stroke-width="1.5"/>
<text x="164" y="901" font-size="22" font-weight="bold">Hybrid: rank fusion</text>
<text x="164" y="929" font-size="20" font-weight="normal">Sum 1 / (60 + one-based rank)</text>
<text x="164" y="954" font-size="20" font-weight="normal">Raw scores stay separate</text>
<path d="M340 972V1002" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M24 590H10V1060H22" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M656 756H670V1060H658" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="1006" width="632" height="100" rx="7" fill="#FFFFFF" stroke="#575D5B" stroke-width="1.5"/>
<text x="38" y="1035" font-size="22" font-weight="bold">Inspect lexical, vector and hybrid rank 1</text>
<text x="38" y="1063" font-size="20" font-weight="normal">Required source span present in the first passage?</text>
<text x="38" y="1088" font-size="20" font-weight="normal">Neighbors still exist for unanswerable questions.</text>
<text x="24" y="1140" font-size="20" font-weight="normal">Executed retrieval experiment. No answer generation.</text>
</g></svg>
