version: "1.0"
status: canonical

# Daily AI Pulse controlled topic vocabulary.
#
# Rules:
# - story topics MUST use one of these slugs unless the vocabulary is intentionally updated;
# - products, companies, labs, and organizations belong in `entities`, not `topics`;
# - avoid aliases that create duplicate concepts;
# - prefer stable engineering concepts over temporary product marketing terms.

topics:
  agents:
    label: Agents
    description: General agent systems, architectures, and behavior.

  coding-agents:
    label: Coding Agents
    parent: agents
    description: Agents that plan, edit, test, review, or operate on software repositories.

  agent-runtime:
    label: Agent Runtime
    parent: agents
    description: Runtime architecture, execution environments, lifecycle, and long-running agent systems.

  agent-security:
    label: Agent Security
    parent: agents
    description: Threat models, trust boundaries, injection, containment, and safety controls for agents.

  multi-agent:
