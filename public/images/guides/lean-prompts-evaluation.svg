<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Compare a prompt edit against its baseline</title><desc id="desc">The same input and settings feed two separate requests. Compare their outputs with an external answer key. Failed requirements mean revising the edit; passing this small comparison only justifies broader testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#575D5B"/></marker></defs><rect width="100%" height="100%" fill="#FAF6EE"/><path d="M285 82 V100 H190 V130" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 82 V100 H530 V130" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 195 V240" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 195 V240" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 305 V330 H285 V355" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 305 V330 H435 V355" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M167 400 H205" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 445 V515" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 585 V610 H185 V640" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="610" fill="#8A4B35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">No</text><path d="M440 585 V610 H535 V640" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="610" fill="#8A4B35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Yes</text><rect x="200" y="22" width="320" height="60" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="360.0" y="52.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Same test input and settings</text><rect x="50" y="130" width="280" height="65" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="190.0" y="162.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Original instructions</text><rect x="390" y="130" width="280" height="65" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="530.0" y="162.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Edited instructions</text><rect x="50" y="240" width="280" height="65" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="190.0" y="272.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Separate baseline request</text><rect x="390" y="240" width="280" height="65" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="530.0" y="272.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Separate edited request</text><rect x="205" y="355" width="310" height="90" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="360.0" y="388.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Compare both outputs</text><text x="360.0" y="412.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">with the answer key</text><rect x="42" y="363" width="125" height="75" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="104.5" y="388.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Answer key</text><text x="104.5" y="412.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">kept outside</text><rect x="205" y="515" width="310" height="70" rx="9" fill="#F3EBDD" stroke="#575D5B"/><text x="360.0" y="550.0" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Requirements met?</text><rect x="42" y="640" width="285" height="75" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="184.5" y="665.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Revise the edit</text><text x="184.5" y="689.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">and compare again</text><rect x="395" y="640" width="285" height="75" rx="9" fill="#FAF6EE" stroke="#575D5B"/><text x="537.5" y="665.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">Candidate for broader</text><text x="537.5" y="689.5" dominant-baseline="middle" text-anchor="middle" fill="#171B1A" font-family="Arial,sans-serif" font-size="18">held-out testing</text></svg>
