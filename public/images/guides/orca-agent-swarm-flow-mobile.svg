<svg xmlns="http://www.w3.org/2000/svg" width="280" height="1150" viewBox="0 0 280 1150" role="img" aria-labelledby="title desc"><title id="title">Five-role agent team</title><desc id="desc">The human sets scope; a Claude coordinator sequences a Claude plan, two parallel Codex workers, integration and a Claude review. At most one correction cycle returns to integration; a human retains acceptance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B" /></marker></defs><rect width="280" height="1150" fill="#FAF6EE" /><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="140.000" y="32" font-size="18" font-weight="600">Five-role agent team</text><rect x="23.333" y="53" width="233.333" height="78" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="82" font-size="17" font-weight="600">Human sets scope</text><text x="140.000" y="107" font-size="17" font-weight="400">Retains acceptance</text><path d="M140.000 131.000 L140.000 155.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="163" width="233.333" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="192" font-size="17" font-weight="600">Claude orchestrator</text><text x="140.000" y="217" font-size="17" font-weight="400">Sequence + keep evidence</text><path d="M140.000 245.000 L140.000 270.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="278" width="233.333" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="307" font-size="17" font-weight="600">Claude planner</text><text x="140.000" y="332" font-size="17" font-weight="400">Commit the contract</text><text x="140.000" y="401" font-size="17" font-weight="600">Two parallel Codex workers</text><rect x="17.889" y="416" width="244.222" height="264" rx="10" fill="none" stroke="#8A4B35" stroke-dasharray="6 5" /><rect x="23.333" y="434" width="233.333" height="88" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="463" font-size="17" font-weight="600">Developer 1: date core</text><text x="140.000" y="488" font-size="17" font-weight="400">Own date core + tests</text><rect x="23.333" y="563" width="233.333" height="88" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="592" font-size="17" font-weight="600">Developer 2: options</text><text x="140.000" y="617" font-size="17" font-weight="400">Own parser + tests</text><path d="M140.000 360.000 V372.000 H9.333 V607.000 H17.111 M9.333 478.000 H17.111" fill="none" stroke="#575D5B" stroke-width="2" /><path d="M256.667 478.000 H270.667 V700.000 H140.000 V716.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="724" width="233.333" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="753" font-size="17" font-weight="600">Orchestrator integrates</text><text x="140.000" y="778" font-size="17" font-weight="400">Test + record commit</text><path d="M140.000 806.000 L140.000 830.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="838" width="233.333" height="82" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="867" font-size="17" font-weight="600">Claude reviewer</text><text x="140.000" y="892" font-size="17" font-weight="400">Findings at exact commit</text><text x="140.000" y="1126" font-size="15" font-weight="600">Dashed: at most one correction</text><path d="M23.333 879.000 H7.778 V765.000 H17.111" fill="none" stroke="#8A4B35" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" /><path d="M140.000 920.000 L140.000 998.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="1006" width="233.333" height="90" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="1035" font-size="17" font-weight="600">Human accepts or defers</text><text x="140.000" y="1060" font-size="17" font-weight="400">No auto-merge or deploy</text><path d="M256.667 607.000 H270.667" fill="none" stroke="#575D5B" stroke-width="2" /></g></svg>
