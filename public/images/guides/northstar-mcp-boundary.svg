<rect x="28" y="340" width="384" height="47" fill="#FAF6EE"/>
<text x="220" y="358" font-size="19">stdio: stdin requests, stdout replies</text><text x="220" y="381" font-size="18" fill="#8A4B35">stderr carries diagnostics separately</text>
<rect x="24" y="412" width="392" height="93" rx="10" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<text x="220" y="445" font-weight="700">Northstar server factory</text><text x="220" y="474">Fixed role limits registrations</text><text x="220" y="496" font-size="17">Annotations describe; handlers enforce</text>
<path d="M220 505V535" fill="none" stroke="#575D5B" stroke-width="2"/>
