<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="title desc"><title id="title">Choose a generative UI boundary</title><desc id="desc">Keep fixed workflows deterministic. For adaptive UI, choose publisher-owned embedded HTML or host-owned components. With host-owned components, evaluate structured descriptions or a compact language. Every action requires server authorization.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#575D5B"/></marker></defs><rect width="100%" height="100%" fill="#FAF6EE"/><rect x="220" y="20" width="380" height="70" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="410.0" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Does a fixed screen handle the task?</text><path d="M220,55 L180,145" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="208.0" y="93.0" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">Yes</text><rect x="20" y="150" width="280" height="70" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="160.0" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Use deterministic UI</text><path d="M410,90 L410,255" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="418.0" y="165.5" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">No</text><rect x="220" y="260" width="380" height="90" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="410.0" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Must the tool publisher deliver</text><text x="410.0" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">its own interface?</text><path d="M600,305 L670,390" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="643.0" y="340.5" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">Yes</text><rect x="510" y="400" width="290" height="85" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="655.0" y="426" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">MCP Apps micro-app</text><text x="655.0" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">HTML + host bridge</text><path d="M325,350 L235,450" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="288.0" y="393.0" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">No</text><rect x="30" y="460" width="400" height="70" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="230.0" y="486" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Use host-owned components</text><path d="M230,530 L155,610" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M330,530 L425,610" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="620" width="280" height="80" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="160.0" y="646" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Structured descriptions</text><text x="160.0" y="670" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Catalog + renderer</text><rect x="320" y="620" width="280" height="80" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="460.0" y="646" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Compact UI language</text><text x="460.0" y="670" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">Parser + reactive runtime</text><rect x="110" y="740" width="600" height="60" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="410.0" y="766" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#171B1A">All actions: server-side authorization</text></svg>