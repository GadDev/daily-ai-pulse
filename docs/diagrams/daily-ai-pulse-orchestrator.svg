<text x="1228" y="982" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Independent Tuesday / Friday editorial workflow.</text>
<text x="1228" y="1007" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Own guides, ledgers and draft PRs; no auto-publish.</text>
