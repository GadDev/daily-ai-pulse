<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc"><title id="title">First-use workflow</title><desc id="desc">The repository baseline leads to one task checkout and one agent. Diff inspection and tests precede human acceptance and integration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B"/></marker></defs><rect width="360" height="810" fill="#FAF6EE"/><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="34" font-size="20" font-weight="600">First change, visible evidence</text><rect x="30" y="65" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2"/><text x="180.0" y="94" font-size="17" font-weight="600">Prepare the repository</text><text x="180.0" y="119" font-size="17" font-weight="400">Git baseline + passing test</text><path d="M180 157 L180 202" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="210" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2"/><text x="180.0" y="239" font-size="17" font-weight="600">Create a task worktree</text><text x="180.0" y="264" font-size="17" font-weight="400">Branch from accepted main</text><path d="M180 302 L180 347" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="355" width="300" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="180.0" y="384" font-size="17" font-weight="600">Launch one coding agent</text><text x="180.0" y="409" font-size="17" font-weight="400">Claude Code OR Codex</text><path d="M180 447 L180 492" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="500" width="300" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="180.0" y="529" font-size="17" font-weight="600">Inspect diff + run tests</text><text x="180.0" y="554" font-size="17" font-weight="400">Check both completion states</text><path d="M180 592 L180 637" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="645" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2"/><text x="180.0" y="674" font-size="17" font-weight="600">Keep the accepted commit</text><text x="180.0" y="699" font-size="17" font-weight="400">Integrate, test, tag checkpoint</text><text x="180" y="782" font-size="17" font-weight="400">Human decides what to keep</text></g></svg>