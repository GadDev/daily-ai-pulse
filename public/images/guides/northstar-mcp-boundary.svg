<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1120" viewBox="0 0 440 1120" role="img" aria-labelledby="title desc">
<title id="title">Northstar local MCP boundary</title>
<desc id="desc">A person using the SDK client or Inspector chooses calls without a model. Claude Code can add model proposals under host permissions. A client talks over stdio to a server with a fixed startup role. Order lookup checks access and format. Policy search returns at most two passages, and a fixed resource exposes the policy catalog. Only protocol messages use stdout; diagnostics use stderr. The server has no arbitrary command, file or URL tool, but stdio does not sandbox a Node process.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#575D5B"/></marker></defs>
<rect width="440" height="1120" rx="16" fill="#FAF6EE"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#171B1A" font-size="21">
<text x="220" y="39" font-weight="700" font-size="25">A small window into data</text>
<rect x="24" y="64" width="190" height="115" rx="10" fill="#F3EBDD" stroke="#575D5B"/>
