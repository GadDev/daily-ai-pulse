<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
<title id="title">Application-side approval boundary</title>
<desc id="desc">The untrusted model proposal is validated, then requires separate reviewer approval bound to the requester and exact proposal. The gate consumes approval once before a mock in-memory action. Invalid or unapproved requests stop.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#171B1A" stroke-width="1.5"/></marker></defs>
<rect width="640" height="690" rx="12" fill="#FAF6EE"/>
<text x="24" y="38" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#171B1A">A proposal is not permission</text>
<rect x="20" y="72" width="350" height="115" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#171B1A"><text x="195" y="104" font-size="22" font-weight="700">Model proposal</text><text x="195" y="137" font-size="17">Untrusted tool + arguments</text><text x="195" y="163" font-size="17">No approval authority</text></g>
<rect x="20" y="222" width="350" height="115" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#171B1A"><text x="195" y="254" font-size="22" font-weight="700">Validate</text><text x="195" y="287" font-size="17">Tool allowlist + argument checks</text><text x="195" y="313" font-size="17">Invalid requests stop here</text></g>
<rect x="20" y="372" width="350" height="115" rx="9" fill="#E8EFEC" stroke="#51796E" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#171B1A"><text x="195" y="404" font-size="22" font-weight="700">Approval gate</text><text x="195" y="437" font-size="17">Match requester + exact proposal</text><text x="195" y="463" font-size="17">Consume approval once</text></g>
<rect x="20" y="522" width="350" height="115" rx="9" fill="#E8EFEC" stroke="#51796E" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#171B1A"><text x="195" y="554" font-size="22" font-weight="700">Mock action</text><text x="195" y="587" font-size="17">Record fictional notice in memory</text><text x="195" y="613" font-size="17">No network or external side effect</text></g>
<rect x="408" y="358" width="210" height="143" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="513" y="391" font-size="21" font-weight="700">Independent</text><text x="513" y="418" font-size="21" font-weight="700">reviewer</text><text x="513" y="452" font-size="17">Approve the exact</text><text x="513" y="477" font-size="17">proposal fingerprint</text></g>
<g fill="none" stroke="#171B1A" stroke-width="2.5" marker-end="url(#arrow)"><path d="M195 189 V216"/><path d="M195 339 V366"/><path d="M195 489 V516"/><path d="M406 430 H376"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#8A4B35"><text x="408" y="258">Invalid → stop</text><text x="408" y="548">No approval → stop</text></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#575D5B"><text x="24" y="664">Conceptual mock: authentication and durable storage are not implemented.</text></g>
</svg>
