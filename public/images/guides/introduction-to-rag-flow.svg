<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
<title id="title">Indexing and query-time retrieval in a RAG system</title>
<desc id="desc">The top lane prepares source documents as a searchable index. The bottom lane retrieves matching, permitted passages and combines them with a question before generation. Embeddings and reranking are optional.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a4b35"/></marker></defs>
<rect width="1260" height="650" rx="16" fill="#f3ebdd"/>
<text x="52" y="55" font-family="Georgia,serif" font-size="29" fill="#171b1a">1. Indexing: prepare knowledge ahead of time</text>
<rect x="38" y="82" width="1184" height="196" rx="16" fill="#e4d8c7" stroke="#c1b39f"/>
<g font-family="Arial,sans-serif" fill="#171b1a" font-size="21" text-anchor="middle">
<rect x="78" y="115" width="240" height="98" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="198" y="158">Source documents</text><text x="198" y="187" font-size="16" fill="#575d5b">policies · manuals · PDFs</text>
<rect x="407" y="115" width="242" height="98" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="528" y="158">Extract + chunk</text><text x="528" y="187" font-size="16" fill="#575d5b">preserve source IDs</text>
<rect x="746" y="115" width="405" height="98" rx="11" fill="#faf6ee" stroke="#8a4b35" stroke-width="3"/>
<text x="948" y="158">Searchable index</text><text x="948" y="187" font-size="16" fill="#575d5b">keywords · optional vectors · hybrid</text>
</g>
<g fill="none" stroke="#8a4b35" stroke-width="3" marker-end="url(#arrow)">
<path d="M322 164H398"/><path d="M652 164H737"/>
</g>
<text x="53" y="326" font-family="Georgia,serif" font-size="29" fill="#171b1a">2. Question time: find context before generating</text>
<rect x="38" y="351" width="1184" height="225" rx="16" fill="#eee4d6" stroke="#c1b39f"/>
<g font-family="Arial,sans-serif" fill="#171b1a" font-size="18" text-anchor="middle">
<rect x="57" y="402" width="173" height="90" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="143" y="448">User question</text>
<rect x="278" y="402" width="203" height="90" rx="11" fill="#faf6ee" stroke="#8a4b35" stroke-width="2"/>
<text x="380" y="437">Retrieve + filter</text><text x="380" y="464" font-size="14" fill="#575d5b">optionally rerank</text>
<rect x="532" y="402" width="209" height="90" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="636" y="438">Selected passages</text><text x="636" y="465" font-size="14" fill="#575d5b">and source IDs</text>
<rect x="795" y="402" width="190" height="90" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="890" y="437">Question + context</text><text x="890" y="464" font-size="14" fill="#575d5b">sent to LLM</text>
<rect x="1031" y="402" width="169" height="90" rx="11" fill="#faf6ee" stroke="#857d72" stroke-width="2"/>
<text x="1115" y="437">Grounded answer</text><text x="1115" y="463" font-size="14" fill="#575d5b">with references</text>
</g>
<g fill="none" stroke="#8a4b35" stroke-width="3" marker-end="url(#arrow)">
<path d="M234 448H269"/><path d="M485 448H523"/><path d="M744 448H786"/><path d="M989 448H1022"/>
</g>
<path d="M948 219V250H380V390" fill="none" stroke="#4f706a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="615" y="264" font-family="Arial,sans-serif" font-size="17" fill="#42635c" text-anchor="middle">query this index (only authorized, current sources)</text>
<text x="58" y="545" font-family="Arial,sans-serif" font-size="17" fill="#575d5b">A retrieved passage is evidence to inspect, not a guaranteed correct answer.</text>
<text x="51" y="622" font-family="Arial,sans-serif" font-size="17" fill="#575d5b">Conceptual architecture · Retrieval may use keyword, vector or hybrid search</text>
</svg>