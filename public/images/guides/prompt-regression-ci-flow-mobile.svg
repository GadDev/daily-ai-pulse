<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1040" viewBox="0 0 420 1040" role="img" aria-labelledby="title desc"><title id="title">Support triage evaluation: fixture and optional model paths</title><desc id="desc">Each case supplies a request to Promptfoo. The default fixture looks up handwritten output by case ID and ignores the prompt. The optional model responds to the rendered prompt. Separate expected labels go directly to assertions. Assertions produce reports and an exit code: zero for pass, one hundred for a failed test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#575D5B"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#171B1A;font-size:21px} .b{fill:#FAF6EE;stroke:#575D5B;stroke-width:1.5} .a{fill:none;stroke:#575D5B;stroke-width:2;marker-end:url(#arrow)} .small{font-size:18px;fill:#575D5B} .strong{font-weight:600} .live{stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#F3EBDD"/><text x="210" y="33" text-anchor="middle" class="strong">Support triage gate</text><rect class="b " x="30" y="60" width="360" height="82" rx="10"/><text x="210.0" y="88" text-anchor="middle" class="strong">12 versioned cases</text><text x="210.0" y="114" text-anchor="middle" class="small">Request + case ID</text><path class="a " d="M210 142 V174"/><rect class="b " x="30" y="178" width="360" height="82" rx="10"/><text x="210.0" y="206" text-anchor="middle" class="strong">Promptfoo</text><text x="210.0" y="232" text-anchor="middle" class="small">Renders the request prompt</text><path class="a " d="M100 260 V292"/><path class="a live" d="M310 260 V415"/><rect class="b " x="30" y="296" width="240" height="83" rx="10"/><text x="150.0" y="324" text-anchor="middle" class="strong">Default: fixture</text><text x="150.0" y="350" text-anchor="middle" class="small">Handwritten JSON by ID</text><text x="40" y="401" class="small">Ignores prompt text.</text><rect class="b live" x="120" y="420" width="280" height="82" rx="10"/><text x="260.0" y="448" text-anchor="middle" class="strong">Optional: local model</text><text x="260.0" y="474" text-anchor="middle" class="small">Responds to the prompt</text><path class="a " d="M80 379 H15 V547 H210 V580"/><path class="a live" d="M265 502 V547 H210"/><rect class="b " x="30" y="585" width="360" height="83" rx="10"/><text x="210.0" y="613" text-anchor="middle" class="strong">Assertions</text><text x="210.0" y="639" text-anchor="middle" class="small">JSON syntax + schema</text><path class="a " d="M210 668 V701"/><rect class="b " x="30" y="705" width="360" height="83" rx="10"/><text x="210.0" y="733" text-anchor="middle" class="strong">Expected labels</text><text x="210.0" y="759" text-anchor="middle" class="small">Compare category / priority / action</text><text x="210" y="814" text-anchor="middle" class="small">Expectations stay out of the prompt.</text><path class="a " d="M210 788 V848"/><rect class="b " x="30" y="853" width="360" height="83" rx="10"/><text x="210.0" y="881" text-anchor="middle" class="strong">JSON + HTML report</text><text x="210.0" y="907" text-anchor="middle" class="small">Exit 0: pass / 100: failure</text><text x="210" y="980" text-anchor="middle" class="small">CI uses fixtures only.</text></svg>