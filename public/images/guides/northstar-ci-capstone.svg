<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1120" viewBox="0 0 340 1120" role="img" aria-labelledby="t d">
<title id="t">Northstar CI: deterministic gate and separate source review</title>
<desc id="d">Ordinary PR checks run without model secrets and save deterministic artifacts. The separate manual job uses trusted main tooling, reads exact target commit text without executing it, runs three fresh review contexts, validates source anchors and snapshot identity, then saves an artifact for human verification. There is no comment, merge or deploy path.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#575D5B"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171B1A;font-size:16px}.h{font-size:18px;font-weight:bold}.s{font-size:14px;fill:#424946}.box{fill:#FAF6EE;stroke:#575D5B;stroke-width:1.4}.flow{fill:none;stroke:#575D5B;stroke-width:1.5;marker-end:url(#a)}</style></defs>
<rect width="340" height="1120" fill="#F3EBDD" rx="12"/>
<text x="20" y="32" class="h">Tests and review, separate jobs</text><text x="20" y="56" class="s">Northstar Helpdesk · Part 7</text>
<rect x="20" y="78" width="300" height="145" rx="8" class="box"/><text x="34" y="107" class="h">Ordinary pull requests</text><text x="34" y="136">No model key · read-only token</text><text x="34" y="164">Gate + capstone → artifacts</text><text x="34" y="192" class="s">Broken behavior must fail.</text><text x="34" y="212" class="s">Untrusted artifacts stay data.</text>
<path d="M20 248H320" stroke="#575D5B" stroke-dasharray="5 5"/><text x="20" y="277" class="h">Optional manual route</text>
<rect x="20" y="299" width="300" height="116" rx="8" class="box"/><text x="34" y="328" class="h">Trusted main tooling</text><text x="34" y="357">Exact base / head commit IDs</text><text x="34" y="385">Target blobs are text only</text><text x="34" y="405" class="s">No target checkout or execution</text><path d="M170 415V440" class="flow"/>
<rect x="20" y="450" width="300" height="110" rx="8" class="box"/><text x="34" y="478" class="h">Bounded source packet</text><text x="34" y="507">Before / after + changed lines</text><text x="34" y="534">Snapshot + test limitations</text><text x="34" y="553" class="s">Inspect before authorizing spend.</text><path d="M170 560V585" class="flow"/>
<rect x="20" y="595" width="300" height="147" rx="8" class="box"/><text x="34" y="624" class="h">Three fresh CLI contexts</text><text x="34" y="653">1. First file · 2. Second file</text><text x="34" y="682">3. Cross-file integration</text><text x="34" y="710" class="s">Print + bare + empty tool pool</text><text x="34" y="732" class="s">Incomplete pass keeps a gap.</text><path d="M170 742V767" class="flow"/>
<rect x="20" y="777" width="300" height="132" rx="8" class="box"/><text x="34" y="805" class="h">Validate and reconcile</text><text x="34" y="834">Current snapshot + exact quotes</text><text x="34" y="862">Deduplicate anchored findings</text><text x="34" y="887" class="s">Old source → historical context</text><text x="34" y="902" class="s">Missing finding ≠ proven repair</text><path d="M170 909V934" class="flow"/>
<rect x="20" y="944" width="300" height="153" rx="8" class="box"/><text x="34" y="973" class="h">Artifact → human verification</text><text x="34" y="1002">Inspect reproduction and tests</text><text x="34" y="1031">Retain usage, gaps, disagreement</text><text x="34" y="1060" class="s">No PR comments, merge or deploy</text><text x="34" y="1084" class="s">A clean report is not a safety proof.</text>
</svg>
