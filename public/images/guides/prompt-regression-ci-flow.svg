<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Support triage evaluation: fixture and optional model paths</title><desc id="desc">Each case supplies a request to Promptfoo. The default fixture looks up handwritten output by case ID and ignores the prompt. The optional model responds to the rendered prompt. Separate expected labels go directly to assertions. Assertions produce reports and an exit code: zero for pass, one hundred for a failed test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#575D5B"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#171B1A;font-size:21px} .b{fill:#FAF6EE;stroke:#575D5B;stroke-width:1.5} .a{fill:none;stroke:#575D5B;stroke-width:2;marker-end:url(#arrow)} .small{font-size:18px;fill:#575D5B} .strong{font-weight:600} .live{stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#F3EBDD"/><text x="32" y="38" class="strong">Two response sources. The same assertions.</text><rect class="b " x="32" y="70" width="300" height="82" rx="10"/><text x="182.0" y="98" text-anchor="middle" class="strong">12 versioned cases</text><text x="182.0" y="124" text-anchor="middle" class="small">Request + case ID</text><rect class="b " x="665" y="70" width="300" height="82" rx="10"/><text x="815.0" y="98" text-anchor="middle" class="strong">Expected labels</text><text x="815.0" y="124" text-anchor="middle" class="small">Category / priority / action</text><path class="a " d="M182 152 V184"/><rect class="b " x="32" y="187" width="300" height="82" rx="10"/><text x="182.0" y="215" text-anchor="middle" class="strong">Promptfoo</text><text x="182.0" y="241" text-anchor="middle" class="small">Renders the request prompt</text><path class="a " d="M150 269 V300 H130 V326"/><path class="a live" d="M250 269 V300 H445 V326"/><rect class="b " x="32" y="330" width="270" height="82" rx="10"/><text x="167.0" y="358" text-anchor="middle" class="strong">Default: fixture</text><text x="167.0" y="384" text-anchor="middle" class="small">Case ID → handwritten JSON</text><rect class="b live" x="330" y="330" width="270" height="82" rx="10"/><text x="465.0" y="358" text-anchor="middle" class="strong">Optional: local model</text><text x="465.0" y="384" text-anchor="middle" class="small">Rendered prompt → response</text><text x="32" y="438" class="small">Fixture ignores prompt text.</text><path class="a " d="M167 412 V478 H640 V384 H665"/><path class="a live" d="M465 412 V478"/><path class="a " d="M815 152 V328"/><rect class="b " x="665" y="330" width="300" height="108" rx="10"/><text x="815.0" y="358" text-anchor="middle" class="strong">Assertions</text><text x="815.0" y="384" text-anchor="middle" class="small">JSON syntax + schema</text><text x="815.0" y="410" text-anchor="middle" class="small">Compare each label</text><path class="a " d="M815 438 V498"/><rect class="b " x="665" y="500" width="300" height="54" rx="10"/><text x="815.0" y="528" text-anchor="middle" class="strong">Report + exit 0 or 100</text><text x="32" y="535" class="small">CI example uses the fixture path only.</text></svg>