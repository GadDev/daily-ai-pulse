<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc"><title id="title">Parallel task integration</title><desc id="desc">Filter and sort worktrees share one accepted base and run independently. Their reviewed commits meet on an integration branch, which receives combined behavior tests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B" /></marker></defs><rect width="360" height="920" fill="#FAF6EE" /><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="34" font-size="20" font-weight="600">Two tasks, one accepted result</text><rect x="30" y="65" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="180.0" y="94" font-size="17" font-weight="600">Accepted marker checkpoint</text><text x="180.0" y="119" font-size="17" font-weight="400">Record the same base SHA</text><text x="180" y="204" font-size="18" font-weight="600">Parallel worktrees</text><rect x="23" y="224" width="314" height="305" rx="10" fill="none" stroke="#8A4B35" stroke-dasharray="6 5" /><rect x="30" y="245" width="300" height="100" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="274" font-size="17" font-weight="600">Filter task</text><text x="180.0" y="299" font-size="17" font-weight="400">Own filter.ts + its tests</text><rect x="30" y="400" width="300" height="100" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="429" font-size="17" font-weight="600">Sort task</text><text x="180.0" y="454" font-size="17" font-weight="400">Own sort.ts + its tests</text><path d="M180 157 V178 H12 V450 H22 M12 295 H22" fill="none" stroke="#575D5B" stroke-width="2" /><path d="M330 295 H348 V560 H180 V582" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="590" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="180.0" y="619" font-size="17" font-weight="600">Integration branch</text><text x="180.0" y="644" font-size="17" font-weight="400">Inspect + cherry-pick commits</text><path d="M180 682 L180 727" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="735" width="300" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="764" font-size="17" font-weight="600">Test combined behavior</text><text x="180.0" y="789" font-size="17" font-weight="400">Filter → sort → format</text><text x="180" y="880" font-size="17" font-weight="400">Preserve evidence before cleanup</text><path d="M330 450 H348" fill="none" stroke="#575D5B" stroke-width="2" /></g></svg>
