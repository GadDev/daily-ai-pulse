<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1050" role="img" aria-labelledby="title desc"><title id="title">Choose a generative UI boundary</title><desc id="desc">Keep fixed workflows deterministic. For adaptive UI, choose publisher-owned embedded HTML or host-owned components. With host-owned components, evaluate structured descriptions or a compact language. Every action requires server authorization.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#575D5B"/></marker></defs><rect width="100%" height="100%" fill="#FAF6EE"/><rect x="20" y="15" width="340" height="85" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="190.0" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Does a fixed screen</text><text x="190.0" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">handle the task?</text><path d="M70,100 L70,135" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="78.0" y="110.5" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">Yes</text><rect x="20" y="145" width="230" height="55" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="135.0" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Use deterministic UI</text><path d="M285,100 L285,245" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="293.0" y="165.5" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">No</text><rect x="20" y="250" width="340" height="85" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="190.0" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Must the tool publisher</text><text x="190.0" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">deliver its own interface?</text><path d="M70,335 L70,375" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="78.0" y="348.0" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">Yes</text><rect x="20" y="385" width="300" height="75" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="170.0" y="411" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">MCP Apps micro-app</text><text x="170.0" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">HTML + host bridge</text><path d="M345,335 L345,515" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="418.0" font-family="system-ui,sans-serif" font-size="16" fill="#8A4B35">No</text><rect x="20" y="525" width="340" height="65" rx="8" fill="#FAF6EE" stroke="#575D5B" stroke-width="2"/><text x="190.0" y="551" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Use host-owned components</text><path d="M100,590 L100,635" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="645" width="340" height="75" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="190.0" y="671" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Structured descriptions</text><text x="190.0" y="695" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Catalog + renderer</text><path d="M345,590 L370,610 L370,813 L362,813" stroke="#575D5B" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="775" width="340" height="75" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="190.0" y="801" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Compact UI language</text><text x="190.0" y="825" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">Parser + reactive runtime</text><rect x="20" y="930" width="340" height="80" rx="8" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/><text x="190.0" y="956" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">All actions require</text><text x="190.0" y="980" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#171B1A">server-side authorization</text></svg>