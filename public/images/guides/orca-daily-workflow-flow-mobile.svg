<svg xmlns="http://www.w3.org/2000/svg" width="280" height="920" viewBox="0 0 280 920" role="img" aria-labelledby="title desc"><title id="title">Parallel task integration</title><desc id="desc">Filter and sort worktrees share one accepted base and run independently. Their reviewed commits meet on an integration branch, which receives combined behavior tests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B" /></marker></defs><rect width="280" height="920" fill="#FAF6EE" /><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="140.000" y="34" font-size="18" font-weight="600">Two tasks, one result</text><rect x="23.333" y="65" width="233.333" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="94" font-size="17" font-weight="600">Accepted marker base</text><text x="140.000" y="119" font-size="17" font-weight="400">Record the same SHA</text><text x="140.000" y="204" font-size="18" font-weight="600">Parallel worktrees</text><rect x="17.889" y="224" width="244.222" height="305" rx="10" fill="none" stroke="#8A4B35" stroke-dasharray="6 5" /><rect x="23.333" y="245" width="233.333" height="100" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="274" font-size="17" font-weight="600">Filter task</text><text x="140.000" y="299" font-size="17" font-weight="400">Own filter + its tests</text><rect x="23.333" y="400" width="233.333" height="100" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="429" font-size="17" font-weight="600">Sort task</text><text x="140.000" y="454" font-size="17" font-weight="400">Own sort + its tests</text><path d="M140.000 157.000 V178.000 H9.333 V450.000 H17.111 M9.333 295.000 H17.111" fill="none" stroke="#575D5B" stroke-width="2" /><path d="M256.667 295.000 H270.667 V560.000 H140.000 V582.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="590" width="233.333" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="619" font-size="17" font-weight="600">Integration branch</text><text x="140.000" y="644" font-size="17" font-weight="400">Inspect + cherry-pick</text><path d="M140.000 682.000 L140.000 727.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="735" width="233.333" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="764" font-size="17" font-weight="600">Test combined behavior</text><text x="140.000" y="789" font-size="17" font-weight="400">Filter → sort → format</text><text x="140.000" y="880" font-size="17" font-weight="400">Keep evidence, then clean up</text><path d="M256.667 450.000 H270.667" fill="none" stroke="#575D5B" stroke-width="2" /></g></svg>
