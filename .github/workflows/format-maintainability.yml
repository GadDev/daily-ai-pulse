name: Format stacked quality files

on:
  push:
    branches: [refactor/content-maintainability-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Format files introduced after the quality baseline
        run: >-
          npx prettier --write
          scripts/validate-content.mjs
          src/components/editorial/*.astro
          src/layouts/BaseLayout.astro
          src/pages/search/index.astro
          'src/pages/stories/[...id].astro'
          tests/e2e/links.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-content.mjs src/components/editorial src/layouts/BaseLayout.astro src/pages/search/index.astro 'src/pages/stories/[...id].astro' tests/e2e/links.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format stacked quality files"
            git push
          fi
