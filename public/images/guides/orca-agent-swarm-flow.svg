<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1150" viewBox="0 0 360 1150" role="img" aria-labelledby="title desc"><title id="title">Five-role agent team</title><desc id="desc">The human sets scope; a Claude coordinator sequences a Claude plan, two parallel Codex workers, integration and a Claude review. At most one correction cycle returns to integration; a human retains acceptance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B" /></marker></defs><rect width="360" height="1150" fill="#FAF6EE" /><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="32" font-size="20" font-weight="600">A supervised five-role team</text><rect x="30" y="53" width="300" height="78" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="82" font-size="17" font-weight="600">Human sets scope</text><text x="180.0" y="107" font-size="17" font-weight="400">Retains final acceptance</text><path d="M180 131 L180 155" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="163" width="300" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="180.0" y="192" font-size="17" font-weight="600">Claude orchestrator</text><text x="180.0" y="217" font-size="17" font-weight="400">Run + evidence + sequencing</text><path d="M180 245 L180 270" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="278" width="300" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="180.0" y="307" font-size="17" font-weight="600">Claude planner</text><text x="180.0" y="332" font-size="17" font-weight="400">Commit the shared contract</text><text x="180" y="401" font-size="17" font-weight="600">Two parallel Codex developers</text><rect x="23" y="416" width="314" height="264" rx="10" fill="none" stroke="#8A4B35" stroke-dasharray="6 5" /><rect x="30" y="434" width="300" height="88" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="463" font-size="17" font-weight="600">Developer 1: date core</text><text x="180.0" y="488" font-size="17" font-weight="400">Own validation + tests</text><rect x="30" y="563" width="300" height="88" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="592" font-size="17" font-weight="600">Developer 2: options</text><text x="180.0" y="617" font-size="17" font-weight="400">Own parsing + tests</text><path d="M180 360 V372 H12 V607 H22 M12 478 H22" fill="none" stroke="#575D5B" stroke-width="2" /><path d="M330 478 H348 V700 H180 V716" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="724" width="300" height="82" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="180.0" y="753" font-size="17" font-weight="600">Orchestrator integrates</text><text x="180.0" y="778" font-size="17" font-weight="400">Test + record exact commit</text><path d="M180 806 L180 830" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="838" width="300" height="82" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="867" font-size="17" font-weight="600">Claude reviewer</text><text x="180.0" y="892" font-size="17" font-weight="400">Findings at that exact commit</text><text x="180" y="1126" font-size="15" font-weight="600">Dashed: at most one correction</text><path d="M30 879 H10 V765 H22" fill="none" stroke="#8A4B35" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" /><path d="M180 920 L180 998" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="1006" width="300" height="90" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="180.0" y="1035" font-size="17" font-weight="600">Human accepts or defers</text><text x="180.0" y="1060" font-size="17" font-weight="400">No automatic merge or deploy</text><path d="M330 607 H348" fill="none" stroke="#575D5B" stroke-width="2" /></g></svg>
