name: Materialize PR 116 illustrations

on:
  push:
    branches:
      - content/2026-09-29-dry-run-1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('.tmp-image-payload/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: content/2026-09-29-dry-run-1

      - name: Decode regenerated illustrations
        run: |
          cat .tmp-image-payload/nvidia.*.part | tr -d '\n' | base64 --decode > public/images/stories/2026-09-29-nvidia-open-agent-safety-platform.webp
          cat .tmp-image-payload/claude.*.part | tr -d '\n' | base64 --decode > public/images/stories/2026-09-29-claude-sonnet-5-5.webp
          rm -rf .tmp-image-payload
          rm .github/workflows/materialize-pr116-images.yml

      - name: Commit materialized assets
        run: |
          git config user.name "Daily AI Pulse automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/stories .tmp-image-payload .github/workflows/materialize-pr116-images.yml || true
          git commit -m "content: materialize v1.2 story illustrations"
          git push origin HEAD:content/2026-09-29-dry-run-1
