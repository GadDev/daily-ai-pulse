name: Bug report
description: Report a reproducible problem with the site or repository
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not use this form for security vulnerabilities; follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the route, content item, browser, commands, or minimal reproduction that helps isolate the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS for UI issues or Node/npm versions for development issues.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant output or screenshots. Remove secrets or personal information first.
