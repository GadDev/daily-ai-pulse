<text x="242" y="961" font-family="'Lato','DejaVu Sans',sans-serif" font-size="21" font-weight="700" fill="#171B1A">Persist a ledger-only batch → still open one draft PR for review.</text>
<text x="84" y="998" font-family="'Lato','DejaVu Sans',sans-serif" font-size="17" font-weight="400" fill="#575D5B">Do not invent news, generate illustrations, or create a daily issue when no candidate passes.</text>
