name: Bootstrap quality gate

on:
  push:
    branches: [chore/quality-gate]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/quality-gate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Format repository
        run: npm run format

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json src docs README.md CONTRIBUTING.md SECURITY.md SUPPORT.md CODE_OF_CONDUCT.md CHANGELOG.md .github '*.mjs' '*.json' '*.md'
          git commit -m "chore(quality): refresh lockfile and format sources"
          git push
