<text x="68" y="146" font-family="'Lato','DejaVu Sans',sans-serif" font-size="25" font-weight="700" fill="#171B1A" letter-spacing="1.6">HOW THE DAILY NEWS ORCHESTRATOR WORKS</text>
<text x="68" y="183" font-family="'Lato','DejaVu Sans',sans-serif" font-size="21" font-weight="400" fill="#575D5B">Current workflow · 22 October 2026 · static Astro publication</text>
<rect x="1284" y="59" width="447" height="85" rx="16" fill="#FAF6EE" stroke="#C7B8A5" stroke-width="1" />
<circle cx="1320" cy="99" r="9" fill="#69977E" stroke="none" stroke-width="1"/>
<text x="1342" y="106" font-family="'Lato','DejaVu Sans',sans-serif" font-size="22" font-weight="700" fill="#171B1A">Daily ChatGPT task · active</text>
<text x="1342" y="132" font-family="'Lato','DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#575D5B">Final publication always needs a human</text>
<path d="M68 210 H1732" stroke="#C7B8A5" stroke-width="1.5"/>
