<svg xmlns="http://www.w3.org/2000/svg" width="360" height="840" viewBox="0 0 360 840" role="img" aria-labelledby="title desc">
<title id="title">Mobile approval boundary</title>
<desc id="desc">An untrusted model proposal is validated. A separate reviewer approves its exact fingerprint. The gate matches the requester and consumes approval once before a mock notice is recorded. Invalid and unapproved requests stop.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#171B1A" stroke-width="1.5"/></marker></defs>
<rect width="360" height="840" rx="12" fill="#FAF6EE"/>
<text x="18" y="34" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#171B1A">A proposal is not permission</text>
<rect x="20" y="62" width="320" height="110" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="93" font-size="22" font-weight="700">Model proposal</text><text x="180" y="126" font-size="19">Untrusted tool + arguments</text><text x="180" y="152" font-size="19">No approval authority</text></g>
<path d="M180 175 V199" fill="none" stroke="#171B1A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="205" width="320" height="110" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="236" font-size="22" font-weight="700">Validate</text><text x="180" y="269" font-size="19">Tool + argument checks</text><text x="180" y="295" font-size="19">Invalid → stop</text></g>
<path d="M180 318 V342" fill="none" stroke="#171B1A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="348" width="320" height="110" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="379" font-size="22" font-weight="700">Independent reviewer</text><text x="180" y="412" font-size="19">Approve the exact</text><text x="180" y="438" font-size="19">proposal fingerprint</text></g>
<path d="M180 461 V485" fill="none" stroke="#171B1A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="491" width="320" height="110" rx="9" fill="#E8EFEC" stroke="#51796E" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="522" font-size="22" font-weight="700">Approval gate</text><text x="180" y="555" font-size="19">Match requester + proposal</text><text x="180" y="581" font-size="19">Consume approval once</text></g>
<path d="M180 604 V628" fill="none" stroke="#171B1A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="634" width="320" height="110" rx="9" fill="#E8EFEC" stroke="#51796E" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#171B1A" text-anchor="middle"><text x="180" y="665" font-size="22" font-weight="700">Mock action</text><text x="180" y="698" font-size="19">Record fictional notice</text><text x="180" y="724" font-size="19">No network or external action</text></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#575D5B"><text x="18" y="783">Conceptual mock: authentication and</text><text x="18" y="808">durable storage are not implemented.</text></g>
</svg>
