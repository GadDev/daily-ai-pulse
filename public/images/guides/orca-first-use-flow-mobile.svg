<svg xmlns="http://www.w3.org/2000/svg" width="280" height="810" viewBox="0 0 280 810" role="img" aria-labelledby="title desc"><title id="title">First-use workflow</title><desc id="desc">The repository baseline leads to one task checkout and one agent. Diff inspection and tests precede human acceptance and integration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#575D5B" /></marker></defs><rect width="280" height="810" fill="#FAF6EE" /><g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle"><text x="140.000" y="34" font-size="18" font-weight="600">First accepted change</text><rect x="23.333" y="65" width="233.333" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="94" font-size="17" font-weight="600">Prepare repository</text><text x="140.000" y="119" font-size="17" font-weight="400">Git + a passing test</text><path d="M140.000 157.000 L140.000 202.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="210" width="233.333" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="239" font-size="17" font-weight="600">Task worktree</text><text x="140.000" y="264" font-size="17" font-weight="400">Start from accepted main</text><path d="M140.000 302.000 L140.000 347.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="355" width="233.333" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="384" font-size="17" font-weight="600">One coding agent</text><text x="140.000" y="409" font-size="17" font-weight="400">Claude Code OR Codex</text><path d="M140.000 447.000 L140.000 492.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="500" width="233.333" height="92" rx="9" fill="#F3EBDD" stroke="#8A4B35" stroke-width="2" /><text x="140.000" y="529" font-size="17" font-weight="600">Diff + tests</text><text x="140.000" y="554" font-size="17" font-weight="400">Check both task states</text><path d="M140.000 592.000 L140.000 637.000" fill="none" stroke="#575D5B" stroke-width="2" marker-end="url(#arrow)" /><rect x="23.333" y="645" width="233.333" height="92" rx="9" fill="#FFFFFF" stroke="#575D5B" stroke-width="2" /><text x="140.000" y="674" font-size="17" font-weight="600">Accept the commit</text><text x="140.000" y="699" font-size="17" font-weight="400">Integrate, test, tag</text><text x="140.000" y="782" font-size="17" font-weight="400">Human keeps or rejects</text></g></svg>
