<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1280" viewBox="0 0 320 1280" role="img" aria-labelledby="title desc">
  <title id="title">Control the call and retain the case</title>
  <desc id="desc">Early handoff checks precede the Agent SDK loop. A pre-tool hook checks calls; read handlers reach the Part 3 server and the action handler independently enforces prerequisites. A post-tool hook normalizes output. Final SDK metadata and retained application state determine a simulation, handoff or abort.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#575D5B"/></marker></defs>
  <rect x="1" y="1" width="318" height="1278" rx="12" fill="#F3EBDD" stroke="#D8CBBB"/>
  <g font-family="system-ui,sans-serif" fill="#171B1A" text-anchor="middle">
    <text x="160" y="30" font-size="18" font-weight="700">Control the call</text>
    <rect x="30" y="52" width="260" height="98" rx="8" fill="#FAF6EE" stroke="#8A4B35"/>
    <text x="160" y="76" font-size="16" font-weight="700">Retained case facts</text>
    <text x="160" y="99" font-size="15">Exact IDs, amount and dates</text>
    <text x="160" y="121" font-size="15">Trusted simulation policy</text>
    <text x="160" y="140" font-size="13">Held outside the conversation</text>
    <path d="M160 150V176" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="180" width="260" height="90" rx="8" fill="#FAF6EE" stroke="#A69A8C"/>
    <text x="160" y="204" font-size="16" font-weight="700">Preflight</text>
    <text x="160" y="226" font-size="15">Human / ambiguous identity /</text>
    <text x="160" y="247" font-size="15">missing policy → handoff</text>
    <path d="M290 225H309V1142H291" fill="none" stroke="#8A4B35" marker-end="url(#arrow)"/>
    <path d="M160 270V306" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="310" width="260" height="88" rx="8" fill="#E5E9E3" stroke="#A69A8C"/>
    <text x="160" y="335" font-size="16" font-weight="700">Agent SDK loop</text>
    <text x="160" y="358" font-size="15">Model proposes a tool</text>
    <text x="160" y="380" font-size="15">Host consumes events once</text>
    <path d="M160 398V426" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="430" width="260" height="88" rx="8" fill="#FAF6EE" stroke="#8A4B35"/>
    <text x="160" y="455" font-size="16" font-weight="700">PreToolUse hook</text>
    <text x="160" y="478" font-size="15">Allowlist + action guard</text>
    <text x="160" y="500" font-size="15">Deny → tool does not run</text>
    <path d="M30 475H19V353H29" fill="none" stroke="#8A4B35" marker-end="url(#arrow)"/>
    <path d="M160 518V543H85V565" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <path d="M160 543H235V565" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="570" width="114" height="160" rx="8" fill="#FAF6EE" stroke="#A69A8C"/>
    <text x="87" y="595" font-size="15" font-weight="700">Read tools</text>
    <text x="87" y="621" font-size="14">Part 3 bridge</text>
    <text x="87" y="645" font-size="14">stdio server</text>
    <text x="87" y="669" font-size="14">Order / policy</text>
    <text x="87" y="693" font-size="14">Validated data</text>
    <text x="87" y="716" font-size="14">5-second limit</text>
    <rect x="176" y="570" width="114" height="160" rx="8" fill="#FAF6EE" stroke="#8A4B35"/>
    <text x="233" y="595" font-size="15" font-weight="700">Action gate</text>
    <text x="233" y="621" font-size="14">Check AGAIN:</text>
    <text x="233" y="645" font-size="14">identity + facts</text>
    <text x="233" y="669" font-size="14">policy + cap</text>
    <text x="233" y="693" font-size="14">Local receipt</text>
    <text x="233" y="716" font-size="14">No real action</text>
    <path d="M87 730V762H233V730" fill="none" stroke="#575D5B"/>
    <path d="M160 762V786" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="790" width="260" height="108" rx="8" fill="#FAF6EE" stroke="#A69A8C"/>
    <text x="160" y="815" font-size="16" font-weight="700">PostToolUse hook</text>
    <text x="160" y="839" font-size="15">Known fields, bounded text</text>
    <text x="160" y="862" font-size="15">No progress → stop / handoff</text>
    <text x="160" y="884" font-size="13">Cannot undo an executed action</text>
    <path d="M30 843H9V332H29" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <path d="M290 355H299V955H291" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="928" width="260" height="112" rx="8" fill="#E5E9E3" stroke="#A69A8C"/>
    <text x="160" y="954" font-size="16" font-weight="700">Final result + case state</text>
    <text x="160" y="978" font-size="15">Receipt + end: simulation</text>
    <text x="160" y="1002" font-size="15">Explicit reason: human handoff</text>
    <text x="160" y="1026" font-size="15">Caps / failures: aborted</text>
    <path d="M160 1040V1076" fill="none" stroke="#575D5B" marker-end="url(#arrow)"/>
    <rect x="30" y="1080" width="260" height="122" rx="8" fill="#FAF6EE" stroke="#8A4B35"/>
    <text x="160" y="1105" font-size="16" font-weight="700">Self-contained record</text>
    <text x="160" y="1129" font-size="15">Exact facts + observed evidence</text>
    <text x="160" y="1153" font-size="15">Attempts, receipt, concerns</text>
    <text x="160" y="1177" font-size="15">Reason + next human action</text>
    <text x="160" y="1232" font-size="15" font-weight="700" fill="#8A4B35">Application code owns permission.</text>
    <text x="160" y="1256" font-size="14">A prompt or final sentence cannot grant it.</text>
  </g>
</svg>
